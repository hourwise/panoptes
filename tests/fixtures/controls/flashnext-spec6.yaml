    max-num-seqs: 1
    max-num-batched-tokens: 2048
    kv-cache-dtype: bf16
    prefix-cache-mib: 4096
    num-speculative-tokens: 6
    draft-window: adaptive
    mm-max-patches: 0
    reasoning-effort: medium
