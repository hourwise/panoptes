server:
  host: 0.0.0.0
  port: 8000
  live: true
  log: info

memory:
  gpu-headroom-mib: 1024
  host-headroom-mib: 8192

models:
  flashnext:
    model: /models/qwen3.8-next-flash-iqr-v4.rad
    tp: 1
    placement: expert_tiered
    host-pool-mib: 65536
